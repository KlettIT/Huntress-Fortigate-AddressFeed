name: huntress-ip-feed

on:
  push:
    branches: [main]
    paths:
      - "sources.txt"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: huntress-feed

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve all domains to IPv4
        run: |
          set -u
          : > feed.new
          while IFS= read -r line || [ -n "$line" ]; do
            domain="$(printf '%s' "$line" | tr -d '[:space:]')"
            [ -z "$domain" ] && continue
            case "$domain" in "#"*) continue ;; esac
            echo "Resolving: $domain"
            # keep plain IPv4 only (dig +short can also print CNAME lines)
            count=$(dig +time=5 +tries=2 +short A "$domain" \
              | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}$' | tee -a feed.new | wc -l)
            [ "$count" -eq 0 ] && echo "WARN: no IPv4 answers for $domain"
            sleep 1
          done < sources.txt
          echo "Fresh resolutions: $(wc -l < feed.new)"

      - name: Guard fresh resolution (DNS outage must not publish an empty feed)
        run: |
          set -eu
          min=10
          if [ "$(wc -l < feed.new)" -lt "$min" ]; then
            echo "ERROR: only $(wc -l < feed.new) fresh IPs, keep previous feed"
            exit 1
          fi

      - name: Merge with previous feed (avoid churn from rotating CDN pools)
        run: |
          set -eu
          max=5000
          if [ -f feed.txt ]; then
            total=$(cat feed.txt feed.new | sort -u | wc -l)
            if [ "$total" -le "$max" ]; then
              # never write to feed.txt while reading it; use a temp file
              cat feed.txt feed.new > feed.merged
              sort -u feed.merged > feed.txt
              rm -f feed.merged
              echo "Merged, feed now has $(wc -l < feed.txt) entries"
            else
              echo "Union exceeds $max, reset to fresh resolutions"
              cp feed.new feed.txt
            fi
          else
            cp feed.new feed.txt
          fi

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.txt
          if git diff --cached --quiet; then
            echo "Feed unchanged, nothing to commit"
          else
            git commit -m "chore: refresh huntress ip feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
