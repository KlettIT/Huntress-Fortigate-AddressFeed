name: huntress-ip-feed

on:
  push:
    branches: [main]
    paths:
      - "sources.txt"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: huntress-feed

jobs:
  build-feed:
    runs-on: ubuntu-latest   # dig is preinstalled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve all domains to IPv4
        run: |
          set -u
          : > feed.new
          while IFS= read -r line || [ -n "$line" ]; do
            # strip all whitespace incl. CR, skip blanks and comments
            domain="$(printf '%s' "$line" | tr -d '[:space:]')"
            [ -z "$domain" ] && continue
            case "$domain" in
              "#"*) continue ;;
            esac
            echo "Resolving: $domain"
            # dig +short may also print CNAME lines; keep plain IPv4 only
            dig +time=5 +tries=2 +short A "$domain" \
              | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}$' >> feed.new || true
            sleep 1
          done < sources.txt
          # deduplicate + stable order
          sort -u feed.new > feed.txt
          rm -f feed.new
          echo "Feed entries: $(wc -l < feed.txt)"

      - name: Validate feed (guard against empty or shrunken feed)
        run: |
          set -eu
          min=10
          count_new=$(wc -l < feed.txt)
          echo "New feed has $count_new entries"
          if [ "$count_new" -lt "$min" ]; then
            echo "ERROR: below minimum ($count_new < $min), keep previous feed"
            exit 1
          fi

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.txt
          if git diff --cached --quiet; then
            echo "Feed unchanged, nothing to commit"
          else
            git commit -m "chore: refresh huntress ip feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
